[workspace]
resolver = "2"
members = ["crates/liana-core", "crates/liana-cli"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"

[workspace.dependencies]
rayon = "1.12"
statrs = "0.19"
rand = "0.10"
rand_pcg = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
