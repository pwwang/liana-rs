[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "liana-rs"
description = "LIANA's ligand-receptor methods in Rust, bit-exact against liana 2.0.0"
requires-python = ">=3.9"
license = "BSD-3-Clause"
dynamic = ["version"]

[tool.maturin]
module-name = "liana_rs._core"
python-source = "python"
